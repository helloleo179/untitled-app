<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro — Kanban Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .task-card { cursor: grab; }
        .task-card:active { cursor: grabbing; }
        .column-drop { min-height: 200px; transition: background-color 0.2s; }
        .column-drop.drag-over { background-color: rgba(59, 130, 246, 0.05); border: 2px dashed #3b82f6; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-xl shadow">🚀</div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">TaskFlow Pro</h1>
                <p class="text-xs text-slate-400">Kanban Board & Productivity Suite</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow transition flex items-center space-x-2">
                <span>+ New Task</span>
            </button>
            <button onclick="clearAllTasks()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-lg text-sm transition" title="Clear All Tasks">🗑️</button>
        </div>
    </header>

    <!-- Main Kanban Board -->
    <main class="flex-1 p-6 overflow-x-auto">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 min-w-[900px] h-full" id="board">
            <!-- Column: Todo -->
            <div class="bg-slate-800/80 rounded-xl border border-slate-700 flex flex-col shadow-lg">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-amber-400"></span>
                        <h2 class="font-semibold text-slate-200">To Do</h2>
                    </div>
                    <span id="count-todo" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <div class="p-4 flex-1 column-drop space-y-3 overflow-y-auto" id="col-todo" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 'todo')">
                </div>
            </div>

            <!-- Column: In Progress -->
            <div class="bg-slate-800/80 rounded-xl border border-slate-700 flex flex-col shadow-lg">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-blue-500"></span>
                        <h2 class="font-semibold text-slate-200">In Progress</h2>
                    </div>
                    <span id="count-inprogress" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <div class="p-4 flex-1 column-drop space-y-3 overflow-y-auto" id="col-inprogress" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 'inprogress')">
                </div>
            </div>

            <!-- Column: Done -->
            <div class="bg-slate-800/80 rounded-xl border border-slate-700 flex flex-col shadow-lg">
                <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                    <div class="flex items-center space-x-2">
                        <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                        <h2 class="font-semibold text-slate-200">Done</h2>
                    </div>
                    <span id="count-done" class="bg-slate-700 text-slate-300 text-xs px-2 py-0.5 rounded-full font-medium">0</span>
                </div>
                <div class="p-4 flex-1 column-drop space-y-3 overflow-y-auto" id="col-done" ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="drop(event, 'done')">
                </div>
            </div>
        </div>
    </main>

    <!-- Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl">
            <h3 class="text-lg font-bold text-white mb-4" id="modalTitle">Create New Task</h3>
            <form id="taskForm" onsubmit="saveTask(event)" class="space-y-4">
                <input type="hidden" id="taskId">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Task Title</label>
                    <input type="text" id="taskTitle" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="e.g. Design landing page">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Description</label>
                    <textarea id="taskDesc" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500" placeholder="Add details about this task..."></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Priority</label>
                    <select id="taskPriority" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                        <option value="low">🟢 Low</option>
                        <option value="medium" selected>🟡 Medium</option>
                        <option value="high">🔴 High</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Status</label>
                    <select id="taskStatus" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                        <option value="todo">To Do</option>
                        <option value="inprogress">In Progress</option>
                        <option value="done">Done</option>
                    </select>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold transition">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        let tasks = JSON.parse(localStorage.getItem('taskflow_tasks')) || [
            { id: '1', title: 'Welcome to TaskFlow Pro', desc: 'Drag tasks between columns, click to edit, or create new ones!', status: 'todo', priority: 'high' },
            { id: '2', title: 'Design system review', desc: 'Check color palette and typography consistency across components.', status: 'inprogress', priority: 'medium' },
            { id: '3', title: 'Deploy to production', desc: 'Push latest updates to cloud servers and check health metrics.', status: 'done', priority: 'low' }
        ];

        function saveToStorage() {
            localStorage.setItem('taskflow_tasks', JSON.stringify(tasks));
        }

        function renderBoard() {
            const columns = { todo: document.getElementById('col-todo'), inprogress: document.getElementById('col-inprogress'), done: document.getElementById('col-done') };
            const counts = { todo: 0, inprogress: 0, done: 0 };

            Object.values(columns).forEach(col => col.innerHTML = '');

            tasks.forEach(task => {
                counts[task.status]++;
                const card = document.createElement('div');
                card.className = 'task-card bg-slate-900 border border-slate-700 hover:border-slate-600 rounded-xl p-4 shadow transition space-y-2';
                card.draggable = true;
                card.ondragstart = (e) => e.dataTransfer.setData('text/plain', task.id);

                let badgeColor = 'bg-slate-700 text-slate-300';
                if (task.priority === 'high') badgeColor = 'bg-rose-500/20 text-rose-400 border border-rose-500/30';
                if (task.priority === 'medium') badgeColor = 'bg-amber-500/20 text-amber-400 border border-amber-500/30';
                if (task.priority === 'low') badgeColor = 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h4 class="font-semibold text-white text-sm">${escapeHtml(task.title)}</h4>
                        <div class="flex space-x-1">
                            <button onclick="editTask('${task.id}')" class="text-slate-400 hover:text-white p-1 text-xs">✏️</button>
                            <button onclick="deleteTask('${task.id}')" class="text-slate-400 hover:text-rose-400 p-1 text-xs">🗑️</button>
                        </div>
                    </div>
                    ${task.desc ? `<p class="text-xs text-slate-400 line-clamp-2">${escapeHtml(task.desc)}</p>` : ''}
                    <div class="flex justify-between items-center pt-2">
                        <span class="text-[10px] px-2 py-0.5 rounded-full uppercase font-bold tracking-wider ${badgeColor}">${task.priority}</span>
                    </div>
                `;
                if (columns[task.status]) {
                    columns[task.status].appendChild(card);
                }
            });

            document.getElementById('count-todo').innerText = counts.todo;
            document.getElementById('count-inprogress').innerText = counts.inprogress;
            document.getElementById('count-done').innerText = counts.done;
        }

        function allowDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function removeDropStyle(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function drop(e, newStatus) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            const taskId = e.dataTransfer.getData('text/plain');
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.status = newStatus;
                saveToStorage();
                renderBoard();
            }
        }

        function openModal(id = null) {
            document.getElementById('taskModal').classList.remove('hidden');
            document.getElementById('taskModal').classList.add('flex');
            if (id) {
                document.getElementById('modalTitle').innerText = 'Edit Task';
                const task = tasks.find(t => t.id === id);
                document.getElementById('taskId').value = task.id;
                document.getElementById('taskTitle').value = task.title;
                document.getElementById('taskDesc').value = task.desc || '';
                document.getElementById('taskPriority').value = task.priority;
                document.getElementById('taskStatus').value = task.status;
            } else {
                document.getElementById('modalTitle').innerText = 'Create New Task';
                document.getElementById('taskForm').reset();
                document.getElementById('taskId').value = '';
            }
        }

        function closeModal() {
            document.getElementById('taskModal').classList.add('hidden');
            document.getElementById('taskModal').classList.remove('flex');
        }

        function saveTask(e) {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value;
            const desc = document.getElementById('taskDesc').value;
            const priority = document.getElementById('taskPriority').value;
            const status = document.getElementById('taskStatus').value;

            if (id) {
                const task = tasks.find(t => t.id === id);
                if (task) {
                    task.title = title;
                    task.desc = desc;
                    task.priority = priority;
                    task.status = status;
                }
            } else {
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    desc,
                    priority,
                    status
                };
                tasks.push(newTask);
            }

            saveToStorage();
            closeModal();
            renderBoard();
        }

        function editTask(id) {
            openModal(id);
        }

        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveToStorage();
                renderBoard();
            }
        }

        function clearAllTasks() {
            if (confirm('Are you sure you want to clear all tasks?')) {
                tasks = [];
                saveToStorage();
                renderBoard();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Initial render
        renderBoard();
    </script>
</body>
</html>
